replicaCount: 1

nameOverride: ""
fullnameOverride: ""

image:
  repository: zot.lan/homereef-seaglass
  tag: latest
  pullPolicy: Always

imagePullSecrets: []

service:
  type: ClusterIP
  port: 5000
  annotations: {}

containerPort: 5000

transflux:
  url: ""

coralforge:
  url: ""

brinecrypt:
  url: ""
  # publicUrl is the browser-reachable URL sent to the frontend for CORS login.
  # Required because brinecrypt.url is an internal k8s service name that pods can
  # resolve but browsers cannot (.lan / split-horizon DNS not configured in CoreDNS).
  # TODO: remove publicUrl and unify once CoreDNS is configured to forward .lan
  #       queries to the local network resolver, or a proper split-horizon DNS is in place.
  publicUrl: ""

ingress:
  enabled: true
  className: ""
  annotations: {}
  hosts:
    - host: seaglass.lan
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

readinessProbe:
  enabled: true
  path: /api/seaglass-version
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 6
  successThreshold: 1

livenessProbe:
  enabled: true
  path: /api/seaglass-version
  initialDelaySeconds: 20
  periodSeconds: 30
  timeoutSeconds: 2
  failureThreshold: 5
  successThreshold: 1

startupProbe:
  enabled: false
  path: /
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 30
  successThreshold: 1

podSecurityContext: {}

securityContext: {}

podAnnotations: {}
deploymentAnnotations: {}

podDisruptionBudget:
  enabled: false
  minAvailable: 1

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 75

env: []
envFrom: []

nodeSelector: {}
tolerations: []
affinity: {}

serviceAccount:
  create: false
  name: ""
  annotations: {}
