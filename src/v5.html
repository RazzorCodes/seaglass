<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Rail Nav Mockup v5</title>
        <link rel="stylesheet" href="v5/styles.css" />
    </head>
    <body>
        <div class="app-shell">
            <nav class="app-rail" id="rail">
                <div class="rail-header" id="rail-header"></div>
                <div class="rail-spacer"></div>
                <button class="rail-btn rail-btn--settings" data-tip="Seaglass Settings">
                    <span class="rail-icon">
                        <svg
                            width="20"
                            height="20"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <circle cx="12" cy="12" r="3" />
                            <path
                                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06
                   a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09
                   A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83
                   l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09
                   A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83
                   l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09
                   a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83
                   l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09
                   a1.65 1.65 0 0 0-1.51 1z"
                            />
                        </svg>
                    </span>
                </button>
            </nav>

            <div class="app-container">
                <nav class="tabs" id="tabbar">
                    <div class="tabs-right" id="tabs-right">
                        <span id="tabs-service-label">No service selected</span>
                    </div>
                </nav>

                <div class="content-area" id="content-area">
                    <div id="content-state">
                        <div class="content-icon" id="content-icon"></div>
                        <span class="content-label" id="content-label">Seaglass — Select a service</span>
                        <span class="content-sublabel" id="content-sublabel"></span>
                    </div>
                    <div class="tab-pane" id="tab-pane" hidden>
                        <div id="tab-toolbar"></div>
                        <div id="tab-results"></div>
                    </div>
                </div>
            </div>
        </div>

        <script src="v5/utils.js"></script>
        <script src="v5/config.js"></script>
        <script src="v5/state.js"></script>
        <script src="v5/dom.js"></script>
        <script src="v5/tint.js"></script>
        <script src="v5/content.js"></script>
        <script src="v5/tabs.js"></script>
        <script src="v5/rail.js"></script>
        <script src="v5/api.js"></script>
        <script src="v5/sessions.js"></script>
        <script src="v5/brinecrypt.js"></script>
        <script src="v5/bcusers.js"></script>
        <script src="v5/bcsa.js"></script>
        <script src="v5/app.js"></script>
    </body>
</html>
